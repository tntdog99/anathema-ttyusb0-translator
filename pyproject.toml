[project]
name = "anathema-ttyusb0-translator"
version = "0.1.7"
description = "a script to help decode ttyUSB0 [M.A.S.L] messages"
readme = "README.md"
authors = [
    { name = "tntdog99", email = "epicghast12@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bitstring",
]

[project.scripts]
anathema-ttyusb0-translator = "anathema_ttyusb0_translator:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
