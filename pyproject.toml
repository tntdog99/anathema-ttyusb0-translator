[project]
name = "anathema-ttyusb0-translator"
version = "0.3.0"
description = "a script to help decode ttyUSB0 [M.A.S.L] messages"
readme = "README.md"
authors = [
    { name = "tntdog99", email = "epicghast12@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bitstring",
    "numba>=0.68.1",
]
license = "LGPL-2.1-or-later WITH WxWindows-exception-3.1"
license-files = ["LICENSES/*"]

[project.scripts]
anathema-ttyusb0-translator = "anathema_ttyusb0_translator:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
