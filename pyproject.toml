[project]
name = "ttytransmission"
version = "0.1.0"
description = "a script to help decode ttyUSB0 [M.A.S.L] messages"
readme = "README.md"
authors = [
    { name = "tntdog99", email = "epicghast12@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bitstring==4.4.0",
]

[project.scripts]
ttytransmission = "ttytransmission:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
